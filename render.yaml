services:
  # FastAPI backend + NSE sidecar (Docker multi-stage)
  - type: web
    name: trading-agent-backend
    runtime: docker
    plan: free
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        value: /var/data/trading_agent.db
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: FYERS_APP_ID
        sync: false
      - key: FYERS_SECRET_KEY
        sync: false
      - key: NSE_SIDECAR_URL
        value: http://localhost:3000
      - key: FRONTEND_URL
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
