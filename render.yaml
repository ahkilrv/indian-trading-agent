services:
  - type: web
    name: trading-agent-backend
    runtime: python
    plan: free
    buildCommand: pip install -e . && pip install fastapi uvicorn websockets aiosqlite numpy feedparser beautifulsoup4 lxml
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT --limit-concurrency 4 --log-level warning
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: FYERS_APP_ID
        sync: false
      - key: FYERS_SECRET_KEY
        sync: false
      - key: NSE_SIDECAR_URL
        value: http://localhost:3000
      - key: FRONTEND_URL
        sync: false
